    /* ===== NEWS VIEW ===== */
    function NewsView() {
      const [items, setItems] = useState(noticiasData);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      useEffect(function() {
        var CACHE_KEY = 'lf_news_cache_v2';
        var CACHE_TTL = 60 * 60 * 1000; // 1h
        var FEED = 'https://www.bernabeudigital.com/rss/?section=4';
        var PROXY = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(FEED);

        function stripHtml(s) {
          var t = document.createElement('div'); t.innerHTML = s || '';
          return (t.textContent || t.innerText || '').replace(/\s+/g, ' ').trim();
        }
        function fmtDate(s) {
          try {
            var d = new Date(s.replace(' ', 'T'));
            if (isNaN(d)) return '';
            return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();
          } catch(e) { return ''; }
        }
        function mapItems(raw) {
          return (raw || []).slice(0, 30).map(function(it){
            var resumen = stripHtml(it.description || it.content || '');
            if (resumen.length > 180) resumen = resumen.substring(0, 177) + '...';
            return { titulo: it.title, url: it.link, fecha: fmtDate(it.pubDate), fuente: 'Bernabéu Digital', resumen: resumen };
          });
        }

        try {
          var cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
          if (cached && (Date.now() - cached.t) < CACHE_TTL && cached.items && cached.items.length > 0) {
            setItems(cached.items); setLoading(false);
          }
        } catch(e) {}

        fetch('/api/news')
          .then(function(r){ if (!r.ok) throw new Error('http'); return r.json(); })
          .then(function(data){
            if (!data || !data.items || data.items.length === 0) throw new Error('empty');
            setItems(data.items);
            try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), items: data.items })); } catch(e) {}
            setLoading(false); setError(null);
          })
          .catch(function(){ return fetch(PROXY)
          .then(function(r){ if (!r.ok) throw new Error('http'); return r.json(); })
          .then(function(data){
            if (data.status !== 'ok' || !data.items) throw new Error('bad-data');
            var mapped = mapItems(data.items);
            if (mapped.length === 0) throw new Error('empty');
            setItems(mapped);
            try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), items: mapped })); } catch(e) {}
            setLoading(false); setError(null);
          })
          .catch(function(){
            setLoading(false);
            // Si no había cache, ya estamos mostrando noticiasData hardcodeado
            if (!localStorage.getItem(CACHE_KEY)) setError('No se pudo actualizar. Mostrando últimas guardadas.');
          }); });
      }, []);

      return (
        <div className="content-area">
          {loading && (
            <div style={{padding:'8px 0 16px',fontSize:'12px',color:'var(--text-2)'}}>Actualizando últimas noticias...</div>
          )}
          {error && (
            <div style={{padding:'8px 12px',marginBottom:'12px',background:'#fef3c7',color:'#92400e',borderRadius:'6px',fontSize:'12px'}}>{error}</div>
          )}
          <div style={{display:'grid',gap:'16px'}}>
            {items.map((n, i) => (
              <a key={i} href={n.url} target="_blank" rel="noopener noreferrer" style={{textDecoration:'none',color:'inherit'}}>
                <div className="info-card" style={{cursor:'pointer',transition:'box-shadow 0.15s',border:'1px solid var(--border-light)'}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'12px',flexWrap:'wrap'}}>
                    <div style={{flex:1,minWidth:'200px'}}>
                      <h3 style={{fontSize:'15px',fontWeight:600,color:'var(--text)',marginBottom:'6px',lineHeight:1.4}}>{n.titulo}</h3>
                      {n.resumen && <p style={{fontSize:'13px',color:'var(--text-2)',lineHeight:1.5,marginBottom:'8px'}}>{n.resumen}</p>}
                      <div style={{display:'flex',gap:'12px',fontSize:'11px',color:'var(--text-3)'}}>
                        <span>{n.fecha}</span>
                        <span style={{color:'var(--accent)',fontWeight:500}}>{n.fuente}</span>
                      </div>
                    </div>
                  </div>
                </div>
              </a>
            ))}
          </div>
        </div>
      );
    }

    /* ===== CUP VIEW (genérico: PIC, Youth League, etc) ===== */
    function CupView({ allPlayers, cupData, rmLabel }) {
      const [selected, setSelected] = useState(null);

      // Construye múltiples índices. Prioriza Castilla > RM C > Juvenil A > resto
      // para ambigüedades (ej: hay 4 "Bruno" en distintos equipos; el del Castilla es el que va en PIC)
      const playerIndex = useMemo(function() {
        var byApodo = {}, byApellido = {};
        function norm(s) { return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(); }
        var priorityOrder = ["Castilla", "Real Madrid C", "Juvenil A", "Juvenil B", "Juvenil C"];
        var sorted = (allPlayers || []).slice().sort(function(a, b) {
          var ai = priorityOrder.indexOf(a.equipo); if (ai < 0) ai = 99;
          var bi = priorityOrder.indexOf(b.equipo); if (bi < 0) bi = 99;
          return ai - bi;
        });
        // First-wins: no sobrescribir claves ya existentes
        sorted.forEach(function(p) {
          var ap = norm(p.apodo);
          var nm = norm(p.nombre);
          if (ap && !byApodo[ap]) byApodo[ap] = p;
          var apClean = ap.replace(/^[a-z]\.\s*/, '');
          if (apClean && !byApodo[apClean]) byApodo[apClean] = p;
          var apParts = ap.split(/\s+/);
          var lastApodo = apParts[apParts.length - 1];
          if (lastApodo && !byApellido[lastApodo]) byApellido[lastApodo] = p;
          var nmParts = nm.split(/\s+/);
          if (nmParts.length >= 3) {
            var firstSurname = nmParts[nmParts.length - 2];
            if (firstSurname && !byApellido[firstSurname]) byApellido[firstSurname] = p;
          }
          if (nmParts.length === 2 && !byApellido[nmParts[1]]) byApellido[nmParts[1]] = p;
        });
        return { byApodo: byApodo, byApellido: byApellido, norm: norm };
      }, [allPlayers]);

      function findPlayer(name) {
        if (!name) return null;
        var k = playerIndex.norm(name);
        if (playerIndex.byApodo[k]) return playerIndex.byApodo[k];
        // Quita prefijo "X. "
        var k2 = k.replace(/^[a-z]\.\s*/, '');
        if (playerIndex.byApodo[k2]) return playerIndex.byApodo[k2];
        if (playerIndex.byApellido[k2]) return playerIndex.byApellido[k2];
        // Última palabra como apellido
        var parts = k.split(/\s+/);
        var last = parts[parts.length - 1];
        if (playerIndex.byApellido[last]) return playerIndex.byApellido[last];
        if (playerIndex.byApodo[last]) return playerIndex.byApodo[last];
        return null;
      }

      function nameFor(rawName) {
        var p = findPlayer(rawName);
        if (p) return getDisplayName(p);
        return rawName;
      }

      function initials(name) {

    /* ===== PIZARRA TÁCTICA ===== */
    function PizarraView({ teamName }) {
      const team = canteraData[teamName];
      const roster = team ? team.jugadores : [];
      const fieldRef = React.useRef(null);
      const [chips, setChips] = useState([]);
      const [rivalColor, setRivalColor] = useState("#dc2626");
      const [snapshots, setSnapshots] = useState(function(){
        try { return JSON.parse(localStorage.getItem("piz_snapshots") || "[]"); } catch(e){ return []; }
      });
      const dragRef = React.useRef(null);
      const [rivalCount, setRivalCount] = useState(0);
      // Herramientas de dibujo
      const [pizTool, setPizTool] = useState('move'); // move | arrow | line | curve
      const [pizDash, setPizDash] = useState(false);
      const [pizColor, setPizColor] = useState('#0f172a');
      const [shapes, setShapes] = useState([]);
      const [drawing, setDrawing] = useState(null);
      // Grabación de movimientos
      const [recording, setRecording] = useState(false);
      const [frames, setFrames] = useState([]);
      const recStartRef = React.useRef(0);
      const lastFrameRef = React.useRef(0);
      const [playing, setPlaying] = useState(false);
      const [playFrameIdx, setPlayFrameIdx] = useState(0);
      const playTimerRef = React.useRef(null);
      const [savedClips, setSavedClips] = useState(function(){
        try { return JSON.parse(localStorage.getItem("piz_clips") || "[]"); } catch(e){ return []; }
      });
      // Narración de voz
      const [currentAudio, setCurrentAudio] = useState(null);
      const [narrating, setNarrating] = useState(false);
      const audioRef = React.useRef(null);
      const mediaRecRef = React.useRef(null);
      const micStreamRef = React.useRef(null);

      function nextId() { return Date.now() + Math.random().toString(36).slice(2, 6); }

      // Captura un frame con el estado actual (chips + shapes)
      function pushFrame() {
        if (!recording) return;
        var t = Date.now() - recStartRef.current;
        if (t - lastFrameRef.current < 60) return; // throttle ~16fps
        lastFrameRef.current = t;
        var snap = { time: t, chips: chips.map(function(c){ return { id: c.id, x: c.x, y: c.y }; }), shapes: shapes.slice() };
        setFrames(function(prev){ return prev.concat([snap]); });
      }
      function startRecording() {
        if (chips.length === 0) { alert('Añade fichas al campo antes de grabar.'); return; }
        recStartRef.current = Date.now();
        lastFrameRef.current = 0;
        setFrames([{ time: 0, chips: chips.map(function(c){ return { id: c.id, x: c.x, y: c.y }; }), shapes: shapes.slice() }]);
        setRecording(true);
        setPlaying(false);
      }
      function stopRecording() {
        // Captura el frame final
        var t = Date.now() - recStartRef.current;
        var snap = { time: t, chips: chips.map(function(c){ return { id: c.id, x: c.x, y: c.y }; }), shapes: shapes.slice() };
        setFrames(function(prev){ return prev.concat([snap]); });
        setRecording(false);
      }
      function playClip() {
        if (frames.length < 2) { alert('No hay nada grabado (graba al menos un movimiento).'); return; }
        setPlaying(true);
        setPlayFrameIdx(0);
        applyFrame(frames[0]);
        // Audio sync
        if (currentAudio && audioRef.current) {
          try { audioRef.current.src = currentAudio; audioRef.current.currentTime = 0; audioRef.current.play().catch(function(){}); } catch(e){}
        }
        var startT = Date.now();
        var firstT = frames[0].time;
        playTimerRef.current = setInterval(function(){
          var elapsed = Date.now() - startT + firstT;
          var idx = 0;
          for (var i = 0; i < frames.length; i++) {
            if (frames[i].time <= elapsed) idx = i; else break;
          }
          if (idx >= frames.length - 1) {
            applyFrame(frames[frames.length - 1]);
            stopPlayback();
          } else {
            // Interpola entre frames idx e idx+1
            var f1 = frames[idx], f2 = frames[idx + 1];
            var span = f2.time - f1.time;
            var prog = span > 0 ? (elapsed - f1.time) / span : 1;
            applyFrameInterp(f1, f2, prog);
            setPlayFrameIdx(idx);
          }
        }, 16);
      }
      function stopPlayback() {
        if (playTimerRef.current) { clearInterval(playTimerRef.current); playTimerRef.current = null; }
        if (audioRef.current) { try { audioRef.current.pause(); } catch(e){} }
        setPlaying(false);
      }

      function startNarration() {
        if (frames.length < 2) { alert('Graba primero los movimientos del clip antes de narrar.'); return; }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
          alert('Tu navegador no soporta grabación de audio.'); return;
        }
        navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
          micStreamRef.current = stream;
          var rec;
          try { rec = new MediaRecorder(stream); } catch(e) { alert('Error iniciando MediaRecorder: ' + e.message); stream.getTracks().forEach(function(t){t.stop();}); return; }
          mediaRecRef.current = rec;
          var chunks = [];
          rec.ondataavailable = function(e){ if (e.data && e.data.size > 0) chunks.push(e.data); };
          rec.onstop = function(){
            var blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
            var reader = new FileReader();
            reader.onloadend = function(){ setCurrentAudio(reader.result); };
            reader.readAsDataURL(blob);
            try { stream.getTracks().forEach(function(t){ t.stop(); }); } catch(e){}
            micStreamRef.current = null; mediaRecRef.current = null;
            setNarrating(false);
          };
          rec.start();
          setNarrating(true);
          // Reproduce el clip mientras narra
          playClip();
          // Para automáticamente al terminar el clip
          var totalDur = (frames[frames.length-1].time - frames[0].time) + 500;
          setTimeout(function(){
            if (mediaRecRef.current && mediaRecRef.current.state === 'recording') mediaRecRef.current.stop();
          }, totalDur);
        }).catch(function(err){
          alert('No se pudo acceder al micrófono: ' + (err.message || err));
        });
      }
      function stopNarration() {
        if (mediaRecRef.current && mediaRecRef.current.state === 'recording') mediaRecRef.current.stop();
        stopPlayback();
      }
      function clearAudio() {
        setCurrentAudio(null);
      }
      function applyFrame(f) {
        setChips(function(prev){
          return prev.map(function(c){
            var fc = f.chips.find(function(x){ return x.id === c.id; });
            return fc ? Object.assign({}, c, { x: fc.x, y: fc.y }) : c;
          });
        });
        setShapes(f.shapes || []);
      }
      function applyFrameInterp(f1, f2, prog) {
        setChips(function(prev){
          return prev.map(function(c){
            var c1 = f1.chips.find(function(x){ return x.id === c.id; });
            var c2 = f2.chips.find(function(x){ return x.id === c.id; });
            if (!c1 || !c2) return c;
            return Object.assign({}, c, { x: c1.x + (c2.x - c1.x) * prog, y: c1.y + (c2.y - c1.y) * prog });
          });
        });
        setShapes(f2.shapes || f1.shapes || []);
      }
      function clearFrames() {
        if (recording) return;
        if (frames.length > 0 && !confirm('¿Descartar grabación actual?')) return;
        setFrames([]);
        setPlayFrameIdx(0);
      }
      function saveClip() {
        if (frames.length < 2) { alert('Nada que guardar.'); return; }
        var name = prompt('Nombre del clip táctico:', 'Jugada ' + (savedClips.length + 1));
        if (!name) return;
        var clip = { id: nextId(), name: name, frames: frames, audio: currentAudio || null, at: new Date().toISOString() };
        var next = savedClips.concat([clip]);
        setSavedClips(next);
        try { localStorage.setItem('piz_clips', JSON.stringify(next)); } catch(e){ alert('Demasiado grande para localStorage. Reduce duración o quita la voz.'); }
      }
      function loadClip(clip) {
        setFrames(clip.frames);
        setCurrentAudio(clip.audio || null);
        if (clip.frames.length > 0) applyFrame(clip.frames[0]);
        alert('Clip cargado' + (clip.audio ? ' con voz' : '') + '. Pulsa "Reproducir" para verlo.');
      }
      function deleteClip(id) {
        var next = savedClips.filter(function(c){ return c.id !== id; });
        setSavedClips(next);
        try { localStorage.setItem('piz_clips', JSON.stringify(next)); } catch(e){}
      }

      function addMadrid(player) {
        var initials = (player.apodo || '').slice(0, 2).toUpperCase();
        var name = getDisplayName(player);
        // Posición inicial: si ya hay chips, distribuir; si no, centro
        var x = 50 + (chips.length * 5) % 30 - 15;
        var y = 50 + (chips.length * 7) % 30 - 15;
        setChips(function(prev){ return prev.concat([{ id: nextId(), team: 'madrid', label: initials, name: name, dorsal: player.dorsal || null, x: x, y: y, photo: player.foto || null }]); });
      }
      function addRival() {
        var n = rivalCount + 1;
        setRivalCount(n);
        setChips(function(prev){ return prev.concat([{ id: nextId(), team: 'rival', label: String(n), name: 'Rival ' + n, x: 50 + (n * 6) % 40 - 20, y: 70 + (n * 4) % 20 - 10, photo: null }]); });
      }
      function clearAll() {
        if (confirm('¿Limpiar campo?')) { setChips([]); setRivalCount(0); }
      }
      function loadElevenInicial() {
        // Pre-llena con 11 jugadores de la plantilla en formación 4-3-3
        var slots = [
          { x:50, y:90 }, { x:88, y:68 }, { x:62, y:74 }, { x:38, y:74 }, { x:12, y:68 },
          { x:50, y:55 }, { x:25, y:40 }, { x:75, y:40 },
          { x:85, y:22 }, { x:50, y:16 }, { x:15, y:22 }
        ];
        var nuevos = [];
        for (var i = 0; i < Math.min(11, roster.length); i++) {
          var p = roster[i];
          var initials = (p.apodo || '').slice(0, 2).toUpperCase();
          nuevos.push({ id: nextId(), team:'madrid', label: initials, name: getDisplayName(p), dorsal: p.dorsal || null, x: slots[i].x, y: slots[i].y, photo: p.foto || null });
        }
        setChips(nuevos);
      }

      // Captura frames automáticamente cuando se mueven chips/shapes durante grabación
      useEffect(function(){
        if (!recording) return;
        var t = Date.now() - recStartRef.current;
        if (t - lastFrameRef.current < 50) return;
        lastFrameRef.current = t;
        setFrames(function(prev){
          return prev.concat([{ time: t, chips: chips.map(function(c){ return { id: c.id, x: c.x, y: c.y }; }), shapes: shapes.slice() }]);
        });
      }, [chips, shapes]);

      // Drag handlers chips
      function onPointerDown(e, chipId) {
        if (pizTool !== 'move') return; // si dibujando, no movemos chips
        if (playing) return; // no mover durante reproducción
        e.preventDefault();
        e.stopPropagation();
        var rect = fieldRef.current.getBoundingClientRect();
        dragRef.current = { id: chipId, rect: rect };
        try { e.target.setPointerCapture(e.pointerId); } catch(err){}
      }
      function onPointerMove(e) {
        // Drawing en curso
        if (drawing) {
          var rectD = fieldRef.current.getBoundingClientRect();
          var dx = ((e.clientX - rectD.left) / rectD.width) * 100;
          var dy = ((e.clientY - rectD.top) / rectD.height) * 100;
          dx = Math.max(0, Math.min(100, dx)); dy = Math.max(0, Math.min(100, dy));
          setDrawing(function(prev){ return prev ? Object.assign({}, prev, { x2: dx, y2: dy }) : prev; });
          return;
        }
        var d = dragRef.current; if (!d) return;
        var rect = d.rect;
        var x = ((e.clientX - rect.left) / rect.width) * 100;
        var y = ((e.clientY - rect.top) / rect.height) * 100;
        x = Math.max(2, Math.min(98, x));
        y = Math.max(2, Math.min(98, y));
        setChips(function(prev){
          return prev.map(function(c){ return c.id === d.id ? Object.assign({}, c, { x: x, y: y }) : c; });
        });
      }
      function onPointerUp() {
        if (drawing) {
          if (Math.abs(drawing.x2 - drawing.x1) > 1.5 || Math.abs(drawing.y2 - drawing.y1) > 1.5) {
            setShapes(function(prev){ return prev.concat([drawing]); });
          }
          setDrawing(null);
          return;
        }
        dragRef.current = null;
      }

      // Drawing en el campo (no chip)
      function onFieldPointerDown(e) {
        if (pizTool === 'move') return;
        // Asegúrate de que el target es el campo, no un chip
        if (e.target.closest('.piz-chip')) return;
        e.preventDefault();
        var rect = fieldRef.current.getBoundingClientRect();
        var x = ((e.clientX - rect.left) / rect.width) * 100;
        var y = ((e.clientY - rect.top) / rect.height) * 100;
        setDrawing({ id: nextId(), tool: pizTool, dash: pizDash, color: pizColor, x1: x, y1: y, x2: x, y2: y });
      }

      function deleteChip(id) {
        setChips(function(prev){ return prev.filter(function(c){ return c.id !== id; }); });
      }
      function deleteShape(id) {
        setShapes(function(prev){ return prev.filter(function(s){ return s.id !== id; }); });
      }
      function clearShapes() {
        if (shapes.length === 0) return;
        if (confirm('¿Borrar todos los trazos?')) setShapes([]);
      }
      // Calcula path SVG según herramienta
      function shapePath(s) {
        if (s.tool === 'curve') {
          var dx = s.x2 - s.x1, dy = s.y2 - s.y1;
          var mx = (s.x1 + s.x2) / 2, my = (s.y1 + s.y2) / 2;
          var len = Math.sqrt(dx*dx + dy*dy) || 1;
          var off = len * 0.3;
          var px = -dy / len, py = dx / len;
          var cx = mx + px * off, cy = my + py * off;
          return 'M ' + s.x1 + ' ' + s.y1 + ' Q ' + cx + ' ' + cy + ' ' + s.x2 + ' ' + s.y2;
        }
        return 'M ' + s.x1 + ' ' + s.y1 + ' L ' + s.x2 + ' ' + s.y2;
      }
      function shapeStroke(s) {
        return s.dash ? '2,1.5' : '0';
      }
      function shapeMarker(s) {
        return (s.tool === 'arrow' || s.tool === 'curve') ? 'url(#piz-arrow-' + s.color.replace('#','') + ')' : '';
      }
      // Marcadores únicos por color
      var allColors = {};
      shapes.forEach(function(s){ allColors[s.color] = true; });
      if (drawing) allColors[drawing.color] = true;
      var colorList = Object.keys(allColors);

      function saveSnapshot() {
        if (typeof window.html2canvas === 'undefined') { alert('Esperando librería de exportación, vuelve a probar en 2s.'); return; }
        var node = fieldRef.current;
        if (!node) return;
        window.html2canvas(node, { backgroundColor: null, useCORS: true, scale: 2, logging: false }).then(function(canvas){
          var dataUrl = canvas.toDataURL('image/png');
          var snap = { id: nextId(), dataUrl: dataUrl, name: 'Posición ' + (snapshots.length + 1), at: new Date().toISOString() };
          var next = snapshots.concat([snap]);
          setSnapshots(next);
          try { localStorage.setItem('piz_snapshots', JSON.stringify(next)); } catch(e){ /* may fail si demasiado grande */ }
        });
      }
      function downloadSnapshot(s) {
        var a = document.createElement('a');
        a.href = s.dataUrl;
        a.download = (s.name || 'pizarra').replace(/[^a-zA-Z0-9_-]/g,'_') + '.png';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
      }
      function deleteSnapshot(id) {
        var next = snapshots.filter(function(s){ return s.id !== id; });
        setSnapshots(next);
        try { localStorage.setItem('piz_snapshots', JSON.stringify(next)); } catch(e){}
      }
      function downloadAll() {
        snapshots.forEach(function(s, i){ setTimeout(function(){ downloadSnapshot(s); }, i * 200); });
      }
      function clearAllSnapshots() {
        if (confirm('¿Borrar todas las instantáneas?')) {
          setSnapshots([]);
          try { localStorage.removeItem('piz_snapshots'); } catch(e){}
        }
      }
      function renameSnapshot(id, newName) {
        var next = snapshots.map(function(s){ return s.id === id ? Object.assign({}, s, { name: newName }) : s; });
        setSnapshots(next);
        try { localStorage.setItem('piz_snapshots', JSON.stringify(next)); } catch(e){}
      }

      var addedIds = chips.filter(function(c){return c.team==='madrid';}).map(function(c){ return c.name; });

      return (
        <div className="piz-wrap">
          <div className="piz-toolbar">
            <button className="piz-btn primary" onClick={loadElevenInicial}>Cargar 11 inicial</button>
            <button className="piz-btn" onClick={addRival}>+ Rival</button>
            <span className="piz-toolbar-label" style={{marginLeft:'8px'}}>Color rival:</span>
            <input type="color" className="piz-color-input" value={rivalColor} onChange={function(e){ setRivalColor(e.target.value); }} />
            <button className="piz-btn" onClick={clearAll} style={{marginLeft:'auto'}}>Limpiar campo</button>
            <button className="piz-btn primary" onClick={saveSnapshot}>📸 Guardar instantánea</button>
          </div>

          <div className="piz-toolbar" style={{background: recording ? '#fee2e2' : 'var(--surface)', borderColor: recording ? '#dc2626' : 'var(--border-light)'}}>
            <span className="piz-toolbar-label" style={{color: recording ? '#991b1b' : 'inherit'}}>{recording ? '🔴 GRABANDO ' + (Math.round((Date.now() - recStartRef.current)/100)/10) + 's' : 'Vídeo táctico:'}</span>
            {!recording && !playing && (
              <button className="piz-btn primary" onClick={startRecording} title="Grabar movimientos">⏺ Grabar</button>
            )}
            {recording && (
              <button className="piz-btn" style={{background:'#dc2626',color:'white',borderColor:'#dc2626'}} onClick={stopRecording}>⏹ Stop</button>
            )}
            {!recording && frames.length > 1 && !playing && (
              <button className="piz-btn primary" onClick={playClip}>▶ Reproducir ({frames.length} frames)</button>
            )}
            {playing && (
              <button className="piz-btn" style={{background:'#dc2626',color:'white',borderColor:'#dc2626'}} onClick={stopPlayback}>⏸ Pausa</button>
            )}
            {!recording && !playing && frames.length > 1 && !narrating && (
              <button className="piz-btn" style={{background:'#0f172a',color:'white',borderColor:'#0f172a'}} onClick={startNarration} title="Graba tu voz mientras se reproduce el clip">🎙️ Narrar voz</button>
            )}
            {narrating && (
              <button className="piz-btn" style={{background:'#dc2626',color:'white',borderColor:'#dc2626'}} onClick={stopNarration}>⏹ Stop voz</button>
            )}
            {!recording && !playing && currentAudio && (
              <span style={{fontSize:'11px',color:'#16a34a',fontWeight:600}}>🎙️ con voz</span>
            )}
            {!recording && !playing && frames.length > 1 && (
              <>
                <button className="piz-btn" onClick={saveClip}>💾 Guardar clip</button>
                <button className="piz-btn" onClick={function(){ clearFrames(); clearAudio(); }}>Descartar</button>
              </>
            )}
          </div>
          {/* Reproductor de audio oculto (sync con la animación) */}
          <audio ref={audioRef} style={{display:'none'}} />


          <div className="piz-toolbar">
            <span className="piz-toolbar-label">Dibujo:</span>
            <button className={"piz-btn" + (pizTool === 'move' ? ' primary' : '')} onClick={function(){ setPizTool('move'); }} title="Mover fichas">✥ Mover</button>
            <button className={"piz-btn" + (pizTool === 'arrow' ? ' primary' : '')} onClick={function(){ setPizTool('arrow'); }} title="Flecha recta">→ Flecha</button>
            <button className={"piz-btn" + (pizTool === 'curve' ? ' primary' : '')} onClick={function(){ setPizTool('curve'); }} title="Flecha curva">↷ Curva</button>
            <button className={"piz-btn" + (pizTool === 'line' ? ' primary' : '')} onClick={function(){ setPizTool('line'); }} title="Línea sin flecha">— Línea</button>
            <button className={"piz-btn" + (pizDash ? ' primary' : '')} onClick={function(){ setPizDash(!pizDash); }} title="Línea discontinua">┄ Discontinua</button>
            <span className="piz-toolbar-label" style={{marginLeft:'8px'}}>Color trazo:</span>
            <input type="color" className="piz-color-input" value={pizColor} onChange={function(e){ setPizColor(e.target.value); }} />
            <button className="piz-btn" onClick={clearShapes} style={{marginLeft:'auto'}}>Borrar trazos</button>
          </div>

          <div className="piz-field-wrap">
            <div ref={fieldRef} className="piz-field" onPointerDown={onFieldPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerLeave={onPointerUp} style={{cursor: pizTool === 'move' ? 'default' : 'crosshair'}}>
              <div className="field-lines">
                <div className="field-center-line"></div>
                <div className="field-center-circle"></div>
                <div className="field-penalty-top"></div>
                <div className="field-penalty-bottom"></div>
                <div className="field-goal-top"></div>
                <div className="field-goal-bottom"></div>
              </div>
              {/* SVG overlay con trazos */}
              <svg className="piz-svg" viewBox="0 0 100 100" preserveAspectRatio="none" style={{position:'absolute',inset:0,width:'100%',height:'100%',pointerEvents:'none',zIndex:1}}>
                <defs>
                  {colorList.map(function(col){
                    var id = 'piz-arrow-' + col.replace('#','');
                    return (
                      <marker key={id} id={id} viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill={col} />
                      </marker>
                    );
                  })}
                </defs>
                {shapes.map(function(s){
                  return (
                    <path key={s.id} d={shapePath(s)} fill="none" stroke={s.color} strokeWidth="0.6" strokeDasharray={shapeStroke(s)} strokeLinecap="round" markerEnd={shapeMarker(s)} style={{pointerEvents:'auto',cursor:'pointer'}} onClick={function(e){ if (pizTool === 'move') { e.stopPropagation(); deleteShape(s.id); } }}>
                      <title>{pizTool === 'move' ? 'Click para borrar' : ''}</title>
                    </path>
                  );
                })}
                {drawing && (
                  <path d={shapePath(drawing)} fill="none" stroke={drawing.color} strokeWidth="0.6" strokeDasharray={shapeStroke(drawing)} strokeLinecap="round" markerEnd={shapeMarker(drawing)} opacity="0.7" />
                )}
              </svg>
              {chips.map(function(c){
                var bgCircle = c.team === 'rival' ? rivalColor : '#1C3B2B';
                return (
                  <div key={c.id} className={"piz-chip " + c.team} style={{left: c.x + '%', top: c.y + '%', zIndex: 2}} onPointerDown={function(e){ onPointerDown(e, c.id); }} onDoubleClick={function(){ deleteChip(c.id); }} title={c.name + ' (doble clic para borrar)'}>
                    <div className="piz-chip-circle" style={{background: bgCircle, borderColor: c.team === 'rival' ? 'white' : bgCircle, position:'relative'}}>
                      {c.team === 'madrid' && c.dorsal ? <span className="piz-chip-dorsal">{c.dorsal}</span> : null}
                      {c.photo ? (
                        <img src={c.photo} alt={c.name} style={{width:'100%',height:'100%',objectFit:'cover',objectPosition:'center 14%',borderRadius:'50%'}} draggable="false" />
                      ) : c.label}
                    </div>
                    {c.team === 'madrid' && c.name && <div className="piz-chip-name">{c.name}</div>}
                  </div>
                );
              })}
            </div>
          </div>

          <div className="piz-roster">
            {roster.map(function(p, i){
              var added = addedIds.indexOf(getDisplayName(p)) >= 0;
              return (
                <div key={i} className={"piz-roster-chip" + (added ? " added" : "")} onClick={function(){ if (!added) addMadrid(p); }}>
                  <div className="piz-roster-mini">{p.dorsal || (p.apodo||'').slice(0,2).toUpperCase()}</div>
                  <span>{getDisplayName(p)}</span>
                </div>
              );
            })}
          </div>

          {savedClips.length > 0 && (
            <div className="piz-snapshots" style={{marginBottom:'14px'}}>
              <h3 style={{margin:'0 0 8px 0',fontSize:'14px',fontWeight:600,color:'var(--text)'}}>Clips tácticos guardados ({savedClips.length})</h3>
              <div style={{display:'flex',flexWrap:'wrap',gap:'8px'}}>
                {savedClips.map(function(clip){
                  return (
                    <div key={clip.id} style={{display:'flex',alignItems:'center',gap:'8px',padding:'8px 12px',background:'var(--surface)',border:'1px solid var(--border-light)',borderRadius:'6px'}}>
                      <span style={{fontSize:'13px',fontWeight:500}}>▶ {clip.name}</span>
                      <span style={{fontSize:'10.5px',color:'var(--text-3)'}}>{clip.frames.length}f</span>
                      {clip.audio && <span style={{fontSize:'11px',color:'#16a34a'}} title="Con narración de voz">🎙️</span>}
                      <button className="piz-snap-btn" onClick={function(){ loadClip(clip); }}>Cargar</button>
                      <button className="piz-snap-btn danger" onClick={function(){ if(confirm('¿Borrar clip?')) deleteClip(clip.id); }}>×</button>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {snapshots.length > 0 && (
            <div className="piz-snapshots">
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'8px'}}>
                <h3 style={{margin:0,fontSize:'14px',fontWeight:600,color:'var(--text)'}}>Instantáneas guardadas ({snapshots.length})</h3>
                <div style={{display:'flex',gap:'6px'}}>
                  <button className="piz-snap-btn" onClick={downloadAll}>↓ Descargar todas</button>
                  <button className="piz-snap-btn danger" onClick={clearAllSnapshots}>Borrar todas</button>
                </div>
              </div>
              <div className="piz-snap-grid">
                {snapshots.map(function(s, idx){
                  return (
                    <div key={s.id} className="piz-snap">
                      <img src={s.dataUrl} alt={s.name} onClick={function(){ downloadSnapshot(s); }} title="Click para descargar" />
                      <div className="piz-snap-label">
                        <input type="text" value={s.name} onChange={function(e){ renameSnapshot(s.id, e.target.value); }} style={{flex:1,minWidth:0,padding:'2px 6px',border:'1px solid var(--border-light)',borderRadius:'4px',fontSize:'11px'}} />
                        <div className="piz-snap-actions">
                          <button className="piz-snap-btn" onClick={function(){ downloadSnapshot(s); }}>↓</button>
                          <button className="piz-snap-btn danger" onClick={function(){ deleteSnapshot(s.id); }}>×</button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ===== HOME / MENÚ ===== */
    function HomeView({ allPlayers, promociones, upcomingBirthdays, onSelectTeam, onShowNews, onShowCaptacion, onShowPromociones, onGlobalSearchSelect, user, calendario }) {
      // ===== HOME PERSONALIZADO PARA ÁLVARO LÓPEZ (entrenador Juvenil A) =====
      if (user === "AlvaroLopez") {
        var alTeamName = "Juvenil A";
        var alTeamData = canteraData[alTeamName];
        var alTeamPlayers = alTeamData ? alTeamData.jugadores : [];
        var alTotalJug = alTeamPlayers.length;
        var alIntl = alTeamPlayers.filter(function(p){ return p.seleccion; });
        var alTotalIntl = alIntl.length;
        // Edad media
        var today = new Date();
        var alEdades = alTeamPlayers.filter(function(p){ return p.fechaNacimiento; }).map(function(p){
          var parts = p.fechaNacimiento.split('/');
          var d = new Date(parseInt(parts[2],10), parseInt(parts[1],10)-1, parseInt(parts[0],10));
          var age = today.getFullYear() - d.getFullYear();
          if (today.getMonth() < d.getMonth() || (today.getMonth() === d.getMonth() && today.getDate() < d.getDate())) age--;
          return age;
        });
        var alEdadMedia = alEdades.length > 0 ? (alEdades.reduce(function(a,b){return a+b;},0) / alEdades.length).toFixed(1) : '-';
        // Próximo partido
        var alProximo = null;
        if (calendario && calendario.partidos) {

                <span className="fh-cta-circle fh-feature-arrow">›</span>

    /* ===== PANEL DE ADMINISTRACIÓN (solo ADMIN_USERS) ===== */
    function AdminPanel({ user }) {
      const [list, setList] = useState(function(){ return lfLocalUsers(); });
      const [remote, setRemote] = useState(null);
      const [nombre, setNombre] = useState("");
      const [usuario, setUsuario] = useState("");
      const [pass, setPass] = useState(function(){ return lfGenPassword(12); });
      const [msg, setMsg] = useState("");
      const [created, setCreated] = useState(null);
      const [busy, setBusy] = useState(false);

      function suggest(n) {
        return (n || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z\s]/g, "").split(/\s+/).filter(Boolean).slice(0, 2)
          .map(function(w){ return w[0].toUpperCase() + w.slice(1).toLowerCase(); }).join("");
      }

      useEffect(function(){
        if (!supabaseClient) { setRemote(false); return; }
        supabaseClient.from('usuarios').select('usuario,nombre,creado_por,created_at').order('created_at', { ascending: false })
          .then(function(res){
            if (res.error) { setRemote(false); return; }
            setRemote(true);
            var map = {};
            lfLocalUsers().forEach(function(u){ map[u.usuario] = u; });
            (res.data || []).forEach(function(u){ map[u.usuario] = Object.assign({}, map[u.usuario] || {}, u, { remoto: true }); });
            setList(Object.keys(map).map(function(k){ return map[k]; }));
          }, function(){ setRemote(false); });
      }, []);

      async function crear() {
        var u = usuario.trim(), p = pass;
        if (!u || !p) { setMsg("Escribe un usuario y una contraseña."); return; }
        if (!/^[A-Za-z0-9._-]{3,30}$/.test(u)) { setMsg("El usuario solo puede tener letras, números, punto, guion o guion bajo (3-30)."); return; }
        if (USERS[u] || list.some(function(x){ return x.usuario === u; })) { setMsg("Ese usuario ya existe."); return; }
        setBusy(true);
        var h = await lfSha256(p);
        var rec = { usuario: u, nombre: nombre.trim() || null, hash: h, creado_por: user, created_at: new Date().toISOString() };
        var locals = lfLocalUsers(); locals.unshift(rec); lfSaveLocalUsers(locals);
        var remotoOk = false;
        if (supabaseClient) { try { var r = await supabaseClient.from('usuarios').insert(rec); remotoOk = !r.error; } catch(e) {} }
        setList([Object.assign({}, rec, { remoto: remotoOk })].concat(list));
        setCreated({ usuario: u, pass: p, remoto: remotoOk });
        setNombre(""); setUsuario(""); setPass(lfGenPassword(12)); setMsg(""); setBusy(false);
      }

      async function resetear(u) {
        var p = lfGenPassword(12); var h = await lfSha256(p);
        lfSaveLocalUsers(lfLocalUsers().map(function(x){ return x.usuario === u ? Object.assign({}, x, { hash: h }) : x; }));
        var ok = false;
        if (supabaseClient) { try { var r = await supabaseClient.from('usuarios').update({ hash: h }).eq('usuario', u); ok = !r.error; } catch(e) {} }
        setCreated({ usuario: u, pass: p, remoto: ok, reset: true });
      }

      async function borrar(u) {
        if (!confirm("¿Eliminar el usuario " + u + "? Dejará de poder entrar.")) return;
        lfSaveLocalUsers(lfLocalUsers().filter(function(x){ return x.usuario !== u; }));
        if (supabaseClient) { try { await supabaseClient.from('usuarios').delete().eq('usuario', u); } catch(e) {} }
        setList(list.filter(function(x){ return x.usuario !== u; }));
        if (created && created.usuario === u) setCreated(null);
      }

      function copiar(t) {
        try { navigator.clipboard.writeText(t).then(function(){ setMsg("Copiado al portapapeles."); }); } catch(e) {}
      }

      var fixed = Object.keys(USERS);
      var credText = created ? ("La Fábrica 26/27\nhttps://lafabricarm.vercel.app\nUsuario: " + created.usuario + "\nContraseña: " + created.pass) : "";
      var card = { background:'var(--surface)', border:'1px solid var(--border-light)', borderRadius:'20px', padding:'24px', boxShadow:'0 1px 2px rgba(16,24,40,.04), 0 14px 34px -20px rgba(16,24,40,.2)' };
      var label = { fontSize:'10.5px', fontWeight:700, letterSpacing:'.14em', textTransform:'uppercase', color:'var(--text-3)', marginBottom:'6px', display:'block' };
      var input = { width:'100%', padding:'11px 14px', border:'1px solid var(--border)', borderRadius:'12px', fontSize:'14px', background:'var(--surface)', color:'var(--text)', outline:'none', fontFamily:'inherit' };
      var ghost = { padding:'8px 14px', borderRadius:'999px', border:'1px solid var(--border)', background:'var(--surface)', color:'var(--accent)', fontSize:'12px', fontWeight:600, cursor:'pointer' };

      return (
        <div style={{padding:'22px 28px 40px', maxWidth:'1100px'}}>
          <div style={{fontSize:'11px', fontWeight:700, letterSpacing:'.28em', textTransform:'uppercase', color:'var(--pink)', marginBottom:'6px'}}>Solo administrador</div>
          <h2 style={{margin:'0 0 6px', fontSize:'30px', fontWeight:800, textTransform:'uppercase', letterSpacing:'-0.02em', color:'var(--accent)'}}>Gestión de usuarios</h2>
          <p style={{margin:'0 0 22px', fontSize:'13px', color:'var(--text-2)'}}>
            {remote === null ? "Comprobando la base de datos…" : remote
              ? "Sincronizado con la base de datos: los usuarios que crees funcionan en cualquier dispositivo."
              : "La base de datos no está disponible ahora mismo: los usuarios que crees solo funcionarán en este navegador hasta que se active la tabla de usuarios."}
          </p>

          <div style={{display:'grid', gridTemplateColumns:'minmax(0,1.1fr) minmax(0,1fr)', gap:'18px', alignItems:'start'}} className="admin-grid">
            <div style={card}>
              <div style={{fontSize:'16px', fontWeight:800, color:'var(--accent)', marginBottom:'16px', textTransform:'uppercase', letterSpacing:'.02em'}}>Generar usuario</div>
              <label style={label}>Nombre (opcional)</label>
              <input style={input} value={nombre} placeholder="Ej. Juan Pérez" onChange={function(e){ var v = e.target.value; setNombre(v); if (!usuario || usuario === suggest(nombre)) setUsuario(suggest(v)); }} />
              <div style={{height:'14px'}}></div>
              <label style={label}>Usuario</label>
              <input style={input} value={usuario} placeholder="Ej. JuanPerez" onChange={function(e){ setUsuario(e.target.value.replace(/\s/g, "")); }} />
              <div style={{height:'14px'}}></div>
              <label style={label}>Contraseña</label>
              <div style={{display:'flex', gap:'8px'}}>
                <input style={Object.assign({}, input, { fontFamily:'ui-monospace, SFMono-Regular, Menlo, monospace', letterSpacing:'.04em' })} value={pass} onChange={function(e){ setPass(e.target.value); }} />
                <button style={ghost} onClick={function(){ setPass(lfGenPassword(12)); }} title="Generar otra">Generar</button>
              </div>
              <button className="login-btn" style={{marginTop:'18px'}} disabled={busy} onClick={crear}>{busy ? "Creando…" : "Crear usuario"}</button>
              {msg && <div style={{marginTop:'10px', fontSize:'12.5px', color:'var(--text-2)'}}>{msg}</div>}

              {created && (
                <div style={{marginTop:'18px', padding:'16px', borderRadius:'14px', background:'var(--ivory)', border:'1px solid #ddd3bf'}}>
                  <div style={{fontSize:'11px', fontWeight:700, letterSpacing:'.14em', textTransform:'uppercase', color:'var(--accent)', marginBottom:'8px'}}>{created.reset ? "Contraseña restablecida" : "Usuario creado"}</div>

            <div style={card}>

              {list.map(function(u){
                return (
                  <div key={u.usuario} style={{display:'flex', alignItems:'center', gap:'10px', padding:'10px 0', borderBottom:'1px solid #f2eee6'}}>
                    <div style={{width:'34px', height:'34px', borderRadius:'50%', background:'var(--accent)', color:'#ECE5D8', display:'flex', alignItems:'center', justifyContent:'center', fontSize:'13px', fontWeight:700, flexShrink:0}}>{u.usuario.charAt(0).toUpperCase()}</div>
                    <div style={{flex:1, minWidth:0}}>
                      <div style={{fontSize:'14px', fontWeight:700}}>{u.usuario}</div>
                      <div style={{fontSize:'11.5px', color:'var(--text-3)'}}>{u.nombre ? u.nombre + " · " : ""}creado por {u.creado_por || "—"}{u.created_at ? " · " + new Date(u.created_at).toLocaleDateString('es-ES') : ""}</div>
                    </div>
                    <button style={ghost} onClick={function(){ resetear(u.usuario); }}>Nueva clave</button>

                  </div>
                );

              {fixed.map(function(u){
                return (
                  <div key={u} style={{display:'flex', alignItems:'center', gap:'10px', padding:'10px 0', borderBottom:'1px solid #f2eee6'}}>
                    <div style={{width:'34px', height:'34px', borderRadius:'50%', background:'var(--ivory)', color:'var(--accent)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:'13px', fontWeight:700, flexShrink:0}}>{u.charAt(0).toUpperCase()}</div>
                    <div style={{flex:1, minWidth:0}}>
                      <div style={{fontSize:'14px', fontWeight:700}}>{u}</div>
                      <div style={{fontSize:'11.5px', color:'var(--text-3)'}}>Usuario fijo de la app</div>
                    </div>
                    {isAdmin(u) && <span style={{fontSize:'10.5px', fontWeight:700, letterSpacing:'.08em', textTransform:'uppercase', padding:'3px 9px', borderRadius:'999px', background:'var(--accent)', color:'#ECE5D8'}}>Admin</span>}
                    {isRestricted(u) && <span style={{fontSize:'10.5px', fontWeight:700, letterSpacing:'.08em', textTransform:'uppercase', padding:'3px 9px', borderRadius:'999px', background:'var(--pink-soft)', color:'var(--pink)'}}>Restringido</span>}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    /* ===== MAIN APP ===== */
    function App() {
      const [user, setUser] = useState(() => sessionStorage.getItem("lfUser") || null);
      const [selectedTeam, setSelectedTeam] = useState(function() {
        try {
          var hash = decodeURIComponent(window.location.hash.substring(1));
          return hash && canteraData[hash] ? hash : "Castilla";
        } catch(e) { return "Castilla"; }
      });
      const [expandedPlayer, setExpandedPlayer] = useState(null);
      const [searchTerm, setSearchTerm] = useState("");
      const [positionFilter, setPositionFilter] = useState("Todas");
      const [yearFilter, setYearFilter] = useState("Todos");
      const [view, setView] = useState("list");
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [showNews, setShowNews] = useState(false);
      const [showCaptacion, setShowCaptacion] = useState(false);
      const [showPromociones, setShowPromociones] = useState(false);
      const [showInternacionales, setShowInternacionales] = useState(false);
      const [showCalendario, setShowCalendario] = useState(false);
      const [calImport, setCalImport] = useState(function(){ try { return JSON.parse(localStorage.getItem("cal_import_2627") || "[]"); } catch(e) { return []; } });
      const [calImportMsg, setCalImportMsg] = useState("");
      const [showProcedencia, setShowProcedencia] = useState(false);
      const [procedenciaTab, setProcedenciaTab] = useState("club");
      const [expandedProcedencia, setExpandedProcedencia] = useState(null);
      const [showGeneraciones, setShowGeneraciones] = useState(false);
      const [generacionAnio, setGeneracionAnio] = useState(null);
      const [showAlvaroWelcome, setShowAlvaroWelcome] = useState(false);
      const [showRadar, setShowRadar] = useState(false);
      const [showBajas, setShowBajas] = useState(false);
      const [showAdmin, setShowAdmin] = useState(false);
      const [bajasFilter, setBajasFilter] = useState("Todos");
      const [radarRivales, setRadarRivales] = useState(function() {
        try { return JSON.parse(localStorage.getItem("radar_rivales") || "{}"); } catch(e) { return {}; }
      });
      const [radarSelectedRival, setRadarSelectedRival] = useState(null);
      const [radarTextarea, setRadarTextarea] = useState("");
      const [showHome, setShowHome] = useState(function(){
        try {
          var hash = decodeURIComponent(window.location.hash.substring(1));
          return !(hash && canteraData[hash]);
        } catch(e) { return true; }
      });
      const [pendingPlayerApodo, setPendingPlayerApodo] = useState(null);
      const [capSugerencias, setCapSugerencias] = useState([]);
      const [capNombre, setCapNombre] = useState("");
      const [capEquipo, setCapEquipo] = useState("");
      const [capEquipoDest, setCapEquipoDest] = useState("");
      const [capFilter, setCapFilter] = useState("Todas");
      const [capLoading, setCapLoading] = useState(false);

      function loadCaptacion() {
        var lsData = JSON.parse(localStorage.getItem("captacion_all") || "[]");
        if (supabaseClient) {
          supabaseClient.from('captacion').select('*').order('created_at', { ascending: false })
            .then(function(res) {
              if (res.error) { setCapSugerencias(lsData); }
              else { setCapSugerencias(res.data || []); }
            });
        } else {
          setCapSugerencias(lsData);
        }
      }

      function addCaptacion() {
        if (!capNombre.trim() || !capEquipo.trim() || !capEquipoDest) return;
        var entry = { usuario: user, nombre: capNombre.trim(), equipo_origen: capEquipo.trim(), equipo_destino: capEquipoDest, created_at: new Date().toISOString() };
        // localStorage
        var lsData = JSON.parse(localStorage.getItem("captacion_all") || "[]");
        lsData.unshift(entry);
        localStorage.setItem("captacion_all", JSON.stringify(lsData));
        // Supabase
        if (supabaseClient) {
          supabaseClient.from('captacion').insert(entry)
            .then(function() { loadCaptacion(); });
        } else {
          setCapSugerencias(lsData);
        }
        setCapNombre(""); setCapEquipo(""); setCapEquipoDest("");
      }

      function deleteCaptacion(item) {
        if (supabaseClient && item.id) {
          supabaseClient.from('captacion').delete().eq('id', item.id)
            .then(function() { loadCaptacion(); });
        } else {
          var lsData = JSON.parse(localStorage.getItem("captacion_all") || "[]");
          lsData = lsData.filter(function(d) { return d.nombre !== item.nombre || d.equipo_origen !== item.equipo_origen || d.usuario !== item.usuario; });
          localStorage.setItem("captacion_all", JSON.stringify(lsData));
          setCapSugerencias(lsData);
        }
      }

      // === Team projections (SergioRguez visible to all) ===
      const [teamProyecciones, setTeamProyecciones] = useState({});
      function loadTeamProyecciones(equipo) {
        var lsData = JSON.parse(localStorage.getItem("proyecciones_all") || "{}");
        if (supabaseClient) {
          supabaseClient.from('proyecciones').select('*').eq('equipo', equipo)
            .then(function(res) {
              if (res.error) {
                var map = {};
                Object.keys(lsData).forEach(function(k) {
                  var parts = k.split("|");
                  if (parts[1] === equipo && parts[2] === 'SergioRguez') map[parts[0]] = lsData[k];
                });
                setTeamProyecciones(map);
              } else {
                var map = {};
                (res.data || []).forEach(function(d) { if (d.usuario === 'SergioRguez' || !map[d.jugador]) map[d.jugador] = d.proyeccion; });
                setTeamProyecciones(map);
              }
            });
        } else {
          var map = {};
          Object.keys(lsData).forEach(function(k) {
            var parts = k.split("|");
            if (parts[1] === equipo && parts[2] === 'SergioRguez') map[parts[0]] = lsData[k];
          });
          setTeamProyecciones(map);
        }
      }


      const currentTeam = canteraData[selectedTeam];
      useEffect(function() { loadTeamProyecciones(selectedTeam); }, [selectedTeam]);

      // Preload de fotos del equipo activo (elimina delay al abrir ficha)
      useEffect(function() {
        if (!currentTeam || !currentTeam.jugadores) return;
        var imgs = [];
        currentTeam.jugadores.forEach(function(p){
          if (p.foto) { var img = new Image(); img.src = p.foto; imgs.push(img); }
        });
        (cuerpoTecnico[selectedTeam] || []).forEach(function(s){
          if (s.foto) { var img = new Image(); img.src = s.foto; imgs.push(img); }
        });
        return function(){ imgs.length = 0; };
      }, [selectedTeam]);

      const positions = ["Todas", "Portero", "Defensa", "Centrocampista", "Delantero"];

      const POSITION_ORDER = {
        // Por posicionDetalle (orden de plantilla del usuario)
        "Portero": 1,
        "Lateral derecho": 2,
        "Central": 3, "Defensa central": 3,
        "Lateral izquierdo": 4,
        "Pivote": 5,
        "Interior defensivo": 6,
        "Mediocentro": 6.5, "Medio": 6.5, "Interior": 6.5,
        "Interior ofensivo": 7,
        "Extremo derecho": 8,
        "Extremo izquierdo": 9,
        "Delantero centro": 10, "Delantero": 10
      };
      function positionRank(p) {
        var detail = p.posicionDetalle;
        if (detail && POSITION_ORDER[detail] !== undefined) return POSITION_ORDER[detail];
        // Fallback por categoría general → ubicar al final del bloque correspondiente
        if (p.posicion === "Portero") return 1.5;
        if (p.posicion === "Defensa") return 4.5;
        if (p.posicion === "Centrocampista") return 7.5;
        if (p.posicion === "Delantero") return 10.5;
        return 99;
      }

      const yearOptions = useMemo(function() {
        var set = {};
        currentTeam.jugadores.forEach(function(p){
          if (p.fechaNacimiento) {
            var parts = p.fechaNacimiento.split('/');
            if (parts.length === 3) set[parts[2]] = true;
          }
        });
        return Object.keys(set).sort();
      }, [currentTeam]);

      const filteredPlayers = useMemo(() => {
        var arr = currentTeam.jugadores.filter(p => {
          const term = searchTerm.toLowerCase();
          const matchesSearch = !term || p.nombre.toLowerCase().includes(term) || p.apodo.toLowerCase().includes(term) || (p.lugarNacimiento && p.lugarNacimiento.toLowerCase().includes(term));
          const matchesPos = positionFilter === "Todas" || p.posicion === positionFilter;
          var year = p.fechaNacimiento ? p.fechaNacimiento.split('/')[2] : '';
          const matchesYear = yearFilter === "Todos" || year === yearFilter;
          return matchesSearch && matchesPos && matchesYear;
        });
        // Orden táctico: POR → LD → DFC → LI → Pivote → MCD → MC → MCO → ED → EI → DC
        return arr.slice().sort(function(a, b) {
          var ra = positionRank(a), rb = positionRank(b);
          if (ra !== rb) return ra - rb;
          // Desempate por dorsal (si existe), luego por apodo
          if (a.dorsal != null && b.dorsal != null) return a.dorsal - b.dorsal;
          return (a.apodo || '').localeCompare(b.apodo || '');
        });
      }, [currentTeam, searchTerm, positionFilter, yearFilter]);

      const stats = useMemo(() => {
        const p = currentTeam.jugadores;
        return {
          total: p.length,
          por: p.filter(x => x.posicion === "Portero").length,
          def: p.filter(x => x.posicion === "Defensa").length,
          med: p.filter(x => x.posicion === "Centrocampista").length,
          del: p.filter(x => x.posicion === "Delantero").length,
          intl: p.filter(x => x.seleccion).length
        };
      }, [currentTeam]);

      const totalPlayers = useMemo(() => {
        return Object.values(canteraData).reduce((acc, t) => acc + t.jugadores.length, 0);
      }, []);

      const allPlayers = useMemo(function() {
        var arr = [];
        Object.keys(canteraData).forEach(function(team) {
          (canteraData[team].jugadores || []).forEach(function(p) {
            arr.push(Object.assign({}, p, { equipo: team }));
          });
        });
        return arr;
      }, []);

      // Categorías (tiers) — Castilla/RMC son Sénior, los Juveniles A/B/C son Juveniles, etc.
      const TEAM_TIER = {
        "Castilla": "Sénior", "Real Madrid C": "Sénior",
        "Juvenil A": "Juveniles", "Juvenil B": "Juveniles", "Juvenil C": "Juveniles",
        "Cadete A": "Cadetes", "Cadete B": "Cadetes",
        "Infantil A": "Infantiles", "Infantil B": "Infantiles",
        "Alevín A": "Alevines", "Alevín B": "Alevines", "Alevín C": "Alevines",
        "Benjamín A": "Benjamines", "Benjamín B": "Benjamines",
        "Prebenjamín A": "Prebenjamines", "Prebenjamín B": "Prebenjamines",
        "Debutante": "Debutantes"
      };
      const TIER_ORDER = ["Sénior", "Juveniles", "Cadetes", "Infantiles", "Alevines", "Benjamines", "Prebenjamines", "Debutantes"];
      function getTierForYear(year) {
        if (year <= 2006) return "Sénior";
        if (year <= 2009) return "Juveniles";
        if (year <= 2011) return "Cadetes";
        if (year <= 2013) return "Infantiles";
        if (year <= 2015) return "Alevines";
        if (year <= 2017) return "Benjamines";
        if (year <= 2019) return "Prebenjamines";
        return "Debutantes";
      }

      const promociones = useMemo(function() {
        var list = [];
        allPlayers.forEach(function(p) {
          if (!p.fechaNacimiento) return;
          var parts = p.fechaNacimiento.split("/");
          if (parts.length !== 3) return;
          var year = parseInt(parts[2], 10);
          var naturalTier = getTierForYear(year);
          var currentTier = TEAM_TIER[p.equipo];
          if (!currentTier || !naturalTier) return;
          var diff = TIER_ORDER.indexOf(naturalTier) - TIER_ORDER.indexOf(currentTier);
          if (diff > 0) list.push({ player: p, escalones: diff, naturalTier: naturalTier });
        });
        list.sort(function(a, b) { return b.escalones - a.escalones; });
        return list;
      }, [allPlayers]);

      // Generaciones: lista de años disponibles + agrupación por equipo
      const generacionesData = useMemo(function() {
        var years = {};
        allPlayers.forEach(function(p) {
          if (p.fechaNacimiento) {
            var parts = p.fechaNacimiento.split('/');
            if (parts.length === 3) years[parts[2]] = true;
          }
        });
        return Object.keys(years).sort();
      }, [allPlayers]);

      const generacionGrouped = useMemo(function() {
        if (!generacionAnio) return null;
        var groups = {};
        allPlayers.forEach(function(p){
          if (!p.fechaNacimiento) return;
          var year = p.fechaNacimiento.split('/')[2];
          if (year !== generacionAnio) return;
          if (!groups[p.equipo]) groups[p.equipo] = [];
          groups[p.equipo].push(p);
        });
        // Ordenar equipos según TEAM_HIERARCHY
        var orderedTeams = TEAM_HIERARCHY.filter(function(t){ return groups[t]; });
        return { teams: orderedTeams, groups: groups, total: Object.keys(groups).reduce(function(acc, k){ return acc + groups[k].length; }, 0) };
      }, [allPlayers, generacionAnio]);

      // Bienvenida especial Álvaro López
      useEffect(function() {
        if (user === "AlvaroLopez") {
          var shown = false;
          try { shown = sessionStorage.getItem("alvaro_welcomed") === "1"; } catch(e) {}
          if (!shown) {
            setShowAlvaroWelcome(true);
          }
        }
      }, [user]);

      function handleCloseAlvaroWelcome() {
        try { sessionStorage.setItem("alvaro_welcomed", "1"); } catch(e) {}
        setShowAlvaroWelcome(false);
        // Llevarle directo a Youth League en Juvenil A
        setSelectedTeam("Juvenil A");
        window.location.hash = "Juvenil A";
        setView("youth");
        setShowHome(false);
        setShowBajas(false);
        setShowAdmin(false);
        setShowNews(false);
        setShowCaptacion(false);
        setShowPromociones(false);
        setShowInternacionales(false);
        setShowCalendario(false);
        setShowProcedencia(false);
        setShowGeneraciones(false);
        try { window.scrollTo({ top: 0, behavior: 'auto' }); } catch(e) { window.scrollTo(0, 0); }
      }

      // Procedencia: ranking por club anterior y lugar de nacimiento
      const procedenciaStats = useMemo(function() {
        var clubs = {}, cities = {};
        allPlayers.forEach(function(p) {
          if (p.origen) {
            // Elimina año al final: "Granada (2022)" → "Granada"
            var club = p.origen.replace(/\s*\(\d{4}\).*$/, '').trim();
            if (club) {
              if (!clubs[club]) clubs[club] = [];
              clubs[club].push(p);
            }
          }
          if (p.lugarNacimiento) {
            var city = p.lugarNacimiento.trim();
            if (city) {
              if (!cities[city]) cities[city] = [];
              cities[city].push(p);
            }
          }
        });
        function toRanking(map) {
          return Object.keys(map).map(function(k){
            return { name: k, count: map[k].length, players: map[k] };
          }).sort(function(a, b){
            if (b.count !== a.count) return b.count - a.count;
            return a.name.localeCompare(b.name);
          });
        }
        return { clubs: toRanking(clubs), cities: toRanking(cities) };
      }, [allPlayers]);

      // Internacionales agrupados por selección
      const internacionales = useMemo(function() {
        var groups = {};
        allPlayers.forEach(function(p){
          if (!p.seleccion) return;
          var key = p.seleccion.trim();
          if (!groups[key]) groups[key] = [];
          groups[key].push(p);
        });
        // Ordenar claves: España primero (por Sub-XX desc), luego otros países
        var keys = Object.keys(groups);
        function parseSub(s) {
          var m = s.match(/Sub-(\d+)/i);
          return m ? parseInt(m[1], 10) : 0;
        }
        function isSpain(s) { return /Espa(?:ñ|n)a/i.test(s); }
        keys.sort(function(a, b) {
          var sa = isSpain(a), sb = isSpain(b);
          if (sa !== sb) return sa ? -1 : 1;
          return parseSub(b) - parseSub(a);
        });
        // Ordena jugadores dentro de cada grupo por apodo
        keys.forEach(function(k){
          groups[k].sort(function(a, b){ return (a.apodo || '').localeCompare(b.apodo || ''); });
        });
        return { keys: keys, groups: groups, total: allPlayers.filter(function(p){ return p.seleccion; }).length };
      }, [allPlayers]);

      // Cumpleaños próximos (hoy + 14 días adelante)
      const upcomingBirthdays = useMemo(function() {
        var DAYS_AHEAD = 14;
        var today = new Date();
        today.setHours(0, 0, 0, 0);
        var list = [];
        allPlayers.forEach(function(p) {
          if (!p.fechaNacimiento) return;
          var parts = p.fechaNacimiento.split("/");
          if (parts.length !== 3) return;
          var day = parseInt(parts[0], 10);
          var month = parseInt(parts[1], 10) - 1;
          var birthYear = parseInt(parts[2], 10);
          if (isNaN(day) || isNaN(month) || isNaN(birthYear)) return;
          var target = new Date(today.getFullYear(), month, day);
          target.setHours(0, 0, 0, 0);
          if (target < today) {
            target = new Date(today.getFullYear() + 1, month, day);
            target.setHours(0, 0, 0, 0);
          }
          var days = Math.round((target.getTime() - today.getTime()) / 86400000);
          if (days <= DAYS_AHEAD) {
            list.push({
              player: p,
              daysUntil: days,
              newAge: target.getFullYear() - birthYear,
              date: target
            });
          }
        });
        list.sort(function(a, b) { return a.daysUntil - b.daysUntil; });
        return list;
      }, [allPlayers]);

      const handleSelectTeam = useCallback((team) => {
        setSelectedTeam(team);
        window.location.hash = team;
        setExpandedPlayer(null);
        setSearchTerm("");
        setPositionFilter("Todas");
        setYearFilter("Todos");
        setView("list");
        setShowNews(false);
        setShowCaptacion(false);
        setShowPromociones(false);
        setShowInternacionales(false);
        setShowCalendario(false);
        setShowProcedencia(false);
        setShowGeneraciones(false);
        setShowRadar(false);
        setShowHome(false);
        setShowBajas(false);
        setShowAdmin(false);
        try { window.scrollTo({ top: 0, behavior: 'auto' }); } catch(e) { window.scrollTo(0, 0); }
      }, []);

      const handleGlobalSearchSelect = useCallback(function(team, apodo) {
        setSelectedTeam(team);
        window.location.hash = team;
        setSearchTerm("");
        setPositionFilter("Todas");
        setView("list");
        setShowNews(false);
        setShowCaptacion(false);
        setShowPromociones(false);
        setShowInternacionales(false);
        setShowCalendario(false);
        setShowProcedencia(false);
        setShowGeneraciones(false);
        setShowRadar(false);
        setShowHome(false);
        setShowBajas(false);
        setShowAdmin(false);
        setPendingPlayerApodo(apodo);
      }, []);

      const handleShowNews = useCallback(() => {
        setShowNews(true);
        setShowCaptacion(false);
        setShowPromociones(false);
        setShowInternacionales(false);
        setShowCalendario(false);
        setShowProcedencia(false);
        setShowGeneraciones(false);
        setShowRadar(false);
        setShowHome(false);
        setShowBajas(false);
        setShowAdmin(false);
        setView("list");
        try { window.scrollTo({ top: 0, behavior: 'auto' }); } catch(e) { window.scrollTo(0, 0); }
      }, []);

      const handleShowCaptacion = useCallback(() => {
        setShowCaptacion(true);
        setShowNews(false);
        setShowPromociones(false);
        setShowInternacionales(false);
        setShowCalendario(false);
        setShowProcedencia(false);
        setShowGeneraciones(false);
        setShowRadar(false);
        setShowHome(false);
        setShowBajas(false);
        setShowAdmin(false);
        loadCaptacion();
        try { window.scrollTo({ top: 0, behavior: 'auto' }); } catch(e) { window.scrollTo(0, 0); }
      }, []);

      const handleShowPromociones = useCallback(() => {
        setShowPromociones(true);
        setShowNews(false);
        setShowCaptacion(false);
        setShowHome(false);

      function parseRadarTextarea(text) {
        var lines = text.split("\n").map(function(l){ return l.trim(); }).filter(Boolean);
        var posMap = {
          "POR":"Portero","P":"Portero","PORTERO":"Portero",
          "DEF":"Defensa","D":"Defensa","DEFENSA":"Defensa","DFC":"Defensa","LD":"Defensa","LI":"Defensa","CENTRAL":"Defensa",
          "MED":"Centrocampista","M":"Centrocampista","MC":"Centrocampista","MCD":"Centrocampista","MCO":"Centrocampista","CENTRO":"Centrocampista","MEDIO":"Centrocampista",
          "DEL":"Delantero","DELANTERO":"Delantero","DC":"Delantero","ED":"Delantero","EI":"Delantero","EXTREMO":"Delantero"
        };
        return lines.map(function(line){
          var parts = line.split(/[-|\t]/).map(function(s){return s.trim();}).filter(Boolean);
          var dorsal = null, nombre = "", posCode = "", anio = "";
          // Detecta dorsal numérico al principio
          if (parts.length >= 2 && /^\d+$/.test(parts[0])) { dorsal = parseInt(parts[0],10); parts.shift(); }
          if (parts.length >= 1) nombre = parts[0];
          if (parts.length >= 2) posCode = parts[1].toUpperCase();
          if (parts.length >= 3) {
            var m = parts[2].match(/(\d{4})/);
            if (m) anio = m[1];
          }
          var posicion = posMap[posCode] || (posCode ? "Centrocampista" : "");
          var posDetalle = posCode || "";
          return { dorsal: dorsal, nombre: nombre, posicion: posicion, posicionDetalle: posDetalle, anio: anio };
        }).filter(function(p){ return p.nombre; });
      }

      // === Importar calendario desde Excel ===
      function calNormKey(s){ return (s||"").toString().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim(); }
      function calPad2(n){ n=String(n); return n.length<2?"0"+n:n; }
      function calToFecha(v){
        if (v instanceof Date && !isNaN(v)) return calPad2(v.getDate())+"/"+calPad2(v.getMonth()+1)+"/"+v.getFullYear();
        var s=String(v||"").trim(); var m=s.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
        if(m){ var y=m[3].length===2?"20"+m[3]:m[3]; return calPad2(m[1])+"/"+calPad2(m[2])+"/"+y; }
        return s;
      }
      function calToHora(v){
        if (v instanceof Date && !isNaN(v)) return calPad2(v.getHours())+":"+calPad2(v.getMinutes());
        var s=String(v||"").trim(); var m=s.match(/(\d{1,2})[:.h](\d{2})/); if(m) return calPad2(m[1])+":"+m[2]; return s;
      }
      function calIsLocal(v){ var s=calNormKey(v); return s.indexOf("casa")>=0 || s.indexOf("local")>=0 || /^(si|s|1|true|l|x)$/.test(s); }
      function handleCalImportFile(e){
        var file = e.target.files && e.target.files[0]; if(!file) return;
        if (typeof XLSX === "undefined"){ setCalImportMsg("No se pudo cargar el lector de Excel. Reintenta en unos segundos."); return; }
        var reader = new FileReader();
        reader.onload = function(ev){
          try{
            var wb = XLSX.read(new Uint8Array(ev.target.result), { type:"array", cellDates:true });
            var ws = wb.Sheets[wb.SheetNames[0]];
            var rows = XLSX.utils.sheet_to_json(ws, { defval:"" });
            var out = [];
            rows.forEach(function(r){
              var o = {}; Object.keys(r).forEach(function(k){ o[calNormKey(k)] = r[k]; });
              var pick = function(keys){ for(var i=0;i<keys.length;i++){ if(o[keys[i]]!==undefined && String(o[keys[i]]).trim()!=="") return o[keys[i]]; } return ""; };
              var equipo = String(pick(["equipo","equipos"])).trim();
              var rival = String(pick(["rival","oponente","contrario","contra"])).trim();
              var fecha = calToFecha(pick(["fecha","dia"]));
              if(!equipo && !rival && !fecha) return;
              out.push({ equipo:equipo, rival:rival, competicion:String(pick(["competicion","competi","liga","torneo"])).trim(), jornada:String(pick(["jornada","jor","j"])).trim(), fecha:fecha, hora:calToHora(pick(["hora","h"])), local:calIsLocal(pick(["local","casa","localia","lugar","casa/fuera","localidad"])), importado:true });
            });
            if(out.length===0){ setCalImportMsg("No se encontraron partidos. Revisa las columnas: Equipo, Rival, Competición, Jornada, Fecha, Hora, Local."); return; }
            setCalImport(out);
            try{ localStorage.setItem("cal_import_2627", JSON.stringify(out)); }catch(e){}
            setCalImportMsg(out.length + " partidos importados.");
          }catch(err){ setCalImportMsg("Error leyendo el Excel: " + err.message); }
        };
        reader.readAsArrayBuffer(file);
        e.target.value = "";
      }
      function clearCalImport(){ setCalImport([]); setCalImportMsg(""); try{ localStorage.removeItem("cal_import_2627"); }catch(e){} }
