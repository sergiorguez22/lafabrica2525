                              var col = tipoColor[b.tipo] || "#475569";
                              return (
                                <div key={i} className="promo-card" style={{cursor:"default"}}>
                                  {b.foto ? <img src={b.foto} alt={b.apodo} className="promo-photo" onError={function(e){ e.target.style.display='none'; e.target.nextSibling.style.display='flex'; }} /> : null}
                                  <div className="promo-photo-fallback" style={{display: b.foto ? 'none' : 'flex', background: getFieldColor(b.posicion)}}>{initials}</div>
                                  <div className="promo-info">
                                    <div className="promo-name">{b.apodo}</div>
                                    <div className="promo-meta">{b.posicion} · {b.fechaNacimiento ? b.fechaNacimiento.split('/')[2] : ''}</div>
                                    <span className="promo-badge" style={{background:col,color:"#fff"}}>{b.tipo}{b.destino ? " · "+b.destino : ""}</span>
                                    {b.nota ? <div style={{fontSize:"10.5px",color:"var(--text-3)",marginTop:"4px",lineHeight:1.3}}>{b.nota}</div> : null}
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                );
              })()
            ) : (
            <>
            <div className="toolbar">
              <div className="view-toggle">
                <button className={`view-btn ${view === 'list' ? 'active' : ''}`} onClick={() => setView('list')}>Plantilla</button>
                <button className={`view-btn ${view === 'field' ? 'active' : ''}`} onClick={() => setView('field')}>Campo</button>
                <button className={`view-btn ${view === 'lineup' ? 'active' : ''}`} onClick={() => setView('lineup')}>Alineación</button>
                {clasificaciones[selectedTeam] && (
                  <button className={`view-btn ${view === 'table' ? 'active' : ''}`} onClick={() => setView('table')}>Clasificación</button>
                )}
                {selectedTeam === "Castilla" && (
                  <button className={`view-btn ${view === 'plicup' ? 'active' : ''}`} onClick={() => setView('plicup')}>Premier Int.</button>
                )}
                {selectedTeam === "Juvenil A" && (
                  <button className={`view-btn ${view === 'youth' ? 'active' : ''}`} onClick={() => setView('youth')}>
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/UEFA_Youth_League.svg/250px-UEFA_Youth_League.svg.png" alt="" style={{width:'14px',height:'14px',verticalAlign:'-2px',marginRight:'5px',objectFit:'contain'}} />
                    Youth League
                  </button>
                )}
                {selectedTeam === "Juvenil A" && (user === "AlvaroLopez" || user === "SergioRguez") && (
                  <button className={`view-btn ${view === 'pizarra' ? 'active' : ''}`} onClick={() => setView('pizarra')}>Pizarra</button>
                )}
              </div>
            </div>

            {view === 'list' && (
              <>
                <div className="filters">
                  <div className="search-box">
                    <SearchIcon />
                    <input className="search-input" type="text" placeholder="Buscar jugador, lugar..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                  </div>
                  <label className={"roster-select" + (positionFilter !== "Todas" ? " on" : "")}>
                    <span className="roster-select-lbl">Posición</span>
                    <select value={positionFilter} onChange={function(e){ setPositionFilter(e.target.value); }}>
                      {positions.map(function(pos){ return <option key={pos} value={pos}>{pos === "Todas" ? "Todas" : pos === "Centrocampista" ? "Centrocampistas" : pos + "s"}</option>; })}
                    </select>
                  </label>
                  {yearOptions.length > 1 && (
                    <label className={"roster-select" + (yearFilter !== "Todos" ? " on" : "")}>
                      <span className="roster-select-lbl">Año</span>
                      <select value={yearFilter} onChange={function(e){ setYearFilter(e.target.value); }}>
                        <option value="Todos">Todos</option>
                        {yearOptions.map(function(y){ return <option key={y} value={y}>{y}</option>; })}
                      </select>
                    </label>
                  )}
                </div>

                <div className="content-area">
                  <div className="table-container">
                    <div className="table-header">
                      <div>#</div>
                      <div>Jugador</div>
                      <div>Nacimiento</div>
                      <div>Lugar de nacimiento</div>
                      <div>Procedencia</div>
                      <div></div>
                    </div>
                    {filteredPlayers.map((player, i) => {
                      const ps = getPositionStyle(player.posicion);
                      const isExpanded = expandedPlayer === i;
                      const bandOf = function(p){ var r = positionRank(p); return r <= 1.5 ? 'Porteros' : r <= 4.5 ? 'Defensas' : r <= 7.5 ? 'Centrocampistas' : 'Delanteros'; };
                      const band = bandOf(player);
                      const showGroup = i === 0 || bandOf(filteredPlayers[i - 1]) !== band;
                      const bandCount = showGroup ? filteredPlayers.filter(function(x){ return bandOf(x) === band; }).length : 0;
                      const initials = (player.apodo || '').split(' ').map(function(w){ return w[0]; }).join('').substring(0, 2).toUpperCase();
                      const age = (function(f){ if (!f) return null; var p = f.split('/'); if (p.length !== 3) return null; var b = new Date(+p[2], +p[1] - 1, +p[0]); var n = new Date(); var a = n.getFullYear() - b.getFullYear(); var mm = n.getMonth() - b.getMonth(); if (mm < 0 || (mm === 0 && n.getDate() < b.getDate())) a--; return a; })(player.fechaNacimiento);
                      return (
                        <div key={i}>
                          {showGroup && (
                            <div className="roster-group">{band}<span className="roster-group-count">{bandCount}</span></div>
                          )}
                          <div className={`table-row ${isExpanded ? 'expanded' : ''}`} onClick={() => setExpandedPlayer(isExpanded ? null : i)}>
                            <div className="row-num">{player.dorsal || (i + 1)}</div>
                            <div className="roster-player">
                              {player.foto ? <img className="roster-avatar" src={player.foto} alt="" loading="lazy" onError={function(e){ e.target.style.display = 'none'; e.target.nextSibling.style.display = 'flex'; }} /> : null}
                              <div className="roster-avatar-fb" style={{display: player.foto ? 'none' : 'flex', background: getFieldColor(player.posicion)}}>{initials}</div>
                              <div style={{minWidth:0}}>
                                <div className="player-name">{player.apodo}<span className="roster-pos" style={{color: ps.dot}}>{posAbbr(player)}</span></div>
                                <div className="player-fullname">{player.nombre}</div>
                              </div>
                            </div>
                            <div className="birth-date">{player.fechaNacimiento || '-'}{age != null && <div className="roster-age">{age} años</div>}</div>
                            <div className="birth-place">{player.lugarNacimiento || '-'}</div>
                            <div className="birth-place">{player.origen || '-'}</div>
                            <div className="chevron"><ChevronIcon open={isExpanded} /></div>
                          </div>
                          {isExpanded && (
                            <div className="expanded-content">
                              <div className="player-card">
                                <PlayerPhoto apodo={player.apodo} posicion={player.posicion} nombre={player.nombre} equipo={selectedTeam} dorsal={player.dorsal} foto={player.foto} />
                                <div className="player-card-info">
                                  <div className="player-card-name">{player.apodo}</div>
                                  <div className="player-card-fullname">{player.nombre}</div>
                                  <div className="player-card-details">
                                    <div className="info-item"><div className="info-label">Posición</div><div className="info-value">{player.posicionDetalle || player.posicion}</div></div>
                                    <div className="info-item"><div className="info-label">Nacimiento</div><div className="info-value">{player.fechaNacimiento || '-'}</div></div>
                                    <div className="info-item"><div className="info-label">Lugar</div><div className="info-value">{player.lugarNacimiento || '-'}</div></div>
                                    <div className="info-item"><div className="info-label">Equipo</div><div className="info-value">{selectedTeam}</div></div>
                                    {player.origen && (
                                      <div className="info-item"><div className="info-label">Anterior club</div><div className="info-value accent">{player.origen}</div></div>
                                    )}
                                    {player.seleccion && (
                                      <div className="info-item"><div className="info-label">Selección</div><div className="info-value"><span className="intl-badge">INT {player.seleccion}</span></div></div>
                                    )}
                                  </div>
                                  {(function(){
                                    var url = getProfileUrl(player, selectedTeam);
                                    return url ? (
                                      <a className="player-card-link" href={url} target="_blank" rel="noopener noreferrer">
                                        Ver perfil oficial en realmadrid.com
                                      </a>
                                    ) : null;
                                  })()}

                                  {(function(){
                                    // Trayectoria: anterior → actual → proyección
                                    var origenRaw = player.origen || '';
                                    var origenMatch = origenRaw.match(/^(.*?)\s*\((\d{4})\)\s*$/);
                                    var origenClub = origenMatch ? origenMatch[1].trim() : origenRaw.trim();
                                    var origenYear = origenMatch ? origenMatch[2] : '';
                                    var proy = (proySergio && proySergio.proyeccion) || proyecciones[user] || null;
                                    if (!proy) {
                                      var others = Object.keys(proyecciones).filter(function(u){ return !isRestricted(user) || u === user; });
                                      if (others.length > 0) proy = proyecciones[others[0]];
                                    }
                                    return (
                                      <div className="trayec">
                                        <div className="trayec-title">Trayectoria</div>
                                        <div className="trayec-line">
                                          {origenClub && (
                                            <>
                                              <div className="trayec-step">
                                                <div className="trayec-step-label">Anterior</div>
                                                <div className="trayec-step-name">{origenClub}</div>
                                                {origenYear && <div className="trayec-step-year">{origenYear}</div>}
                                              </div>
                                              <div className="trayec-arrow">→</div>
                                            </>
                                          )}
                                          <div className="trayec-step current">
                                            <div className="trayec-step-label">Actual</div>
                                            <div className="trayec-step-name">{selectedTeam}</div>
                                            <div className="trayec-step-year">2026/27</div>
                                          </div>
                                          {proy && (
                                            <>
                                              <div className="trayec-arrow">→</div>
                                              <div className="trayec-step future">
                                                <div className="trayec-step-label">Proyección</div>
                                                <div className="trayec-step-name">{proy}</div>
                                                <div className="trayec-step-year">27/28</div>
                                              </div>
                                            </>
                                          )}
                                        </div>
                                      </div>
                                    );
                                  })()}

                                  <button className="scout-toggle" onClick={function(e){e.stopPropagation();setScoutOpen(!scoutOpen);}}>
                                    <div className="scout-toggle-left">
                                      <span>Expectativa de crecimiento</span>
                                      <div className="scout-toggle-counts">
                                        {Object.keys(proyecciones).filter(function(u){ return !isRestricted(user) || u === user; }).length > 0 && <span className="scout-toggle-count" style={{background:'var(--accent-light)',color:'var(--accent)'}}>{Object.keys(proyecciones).filter(function(u){ return !isRestricted(user) || u === user; }).length} exp</span>}
                                        {informes.filter(function(inf){ return !isRestricted(user) || inf.usuario === user; }).length > 0 && <span className="scout-toggle-count" style={{background:'#fef3c7',color:'#92400e'}}>{informes.filter(function(inf){ return !isRestricted(user) || inf.usuario === user; }).length} inf</span>}
                                      </div>
                                    </div>
                                    <span className={"scout-toggle-arrow" + (scoutOpen ? " open" : "")}>▼</span>
                                  </button>
                                  {scoutOpen && (
                                  <div className="scout-panel" onClick={function(e){e.stopPropagation();}}>
                                    <div style={{marginBottom:'14px'}}>
                                      <div style={{fontSize:'11px',fontWeight:600,color:'var(--text-2)',textTransform:'uppercase',marginBottom:'8px'}}>Tu expectativa</div>
                                      <select className="proy-select" value={proyecciones[user] || ""} disabled={proySaving} onChange={function(e){ saveProyeccion(player.nombre, selectedTeam, e.target.value); }}>
                                        <option value="">Sin expectativa</option>
                                        {getHigherTeams(selectedTeam).map(function(t){ return <option key={t} value={t}>{getCapLabel(t)}</option>; })}
                                      </select>
                                    </div>
                                    {Object.keys(proyecciones).filter(function(u){ return !isRestricted(user) || u === user; }).length > 0 && (
                                      <div style={{marginBottom:'14px'}}>
                                        <div style={{fontSize:'11px',fontWeight:600,color:'var(--text-2)',textTransform:'uppercase',marginBottom:'8px'}}>Valoraciones</div>
                                        <div style={{display:'flex',flexDirection:'column',gap:'6px'}}>
                                          {Object.keys(proyecciones).filter(function(u){ return !isRestricted(user) || u === user; }).map(function(u) {
                                            var val = proyecciones[u];
                                            var col = PROY_COLORS[val] || {};
                                            return (
                                              <div key={u} style={{display:'flex',alignItems:'center',gap:'8px'}}>
                                                <span style={{fontSize:'12px',color:'var(--text-2)',minWidth:'70px'}}>{u === user ? 'Tú' : u}:</span>
                                                <span className="proy-badge" style={{background: col.bg, color: col.text, border: '1px solid ' + (col.border || '#ccc')}}>{getCapLabel(val)}</span>
                                              </div>
                                            );
                                          })}
                                        </div>
                                      </div>
                                    )}
                                    <div style={{borderTop:'1px solid var(--border-light)',paddingTop:'14px'}}>
                                      <div className="informes-header">
                                        <div style={{fontSize:'11px',fontWeight:600,color:'var(--text-2)',textTransform:'uppercase'}}>Informes <span className="informes-count">{informes.filter(function(inf){ return !isRestricted(user) || inf.usuario === user; }).length}</span></div>
                                        {!informeFormOpen && <button className="informe-btn informe-btn-primary" onClick={function(){setInformeFormOpen(true);setInformeTexto("");setInformeEditing(null);}}>+ Nuevo</button>}
                                      </div>
                                      {informeFormOpen && (
                                        <div className="informe-form">
                                          <textarea className="informe-textarea" value={informeTexto} onChange={function(e){setInformeTexto(e.target.value);}} placeholder="Escribe tus notas sobre este jugador..." />
                                          <div className="informe-actions">
                                            <button className="informe-btn informe-btn-cancel" onClick={function(){setInformeFormOpen(false);setInformeTexto("");setInformeEditing(null);}}>Cancelar</button>
                                            <button className="informe-btn informe-btn-primary" disabled={!informeTexto.trim()} onClick={function(){saveInforme(player.nombre,selectedTeam);}}>{informeEditing ? "Actualizar" : "Guardar"}</button>
                                          </div>
                                        </div>
                                      )}
                                      {informeLoading ? (
                                        <div className="informe-loading">Cargando...</div>
                                      ) : informes.filter(function(inf){ return !isRestricted(user) || inf.usuario === user; }).length === 0 && !informeFormOpen ? (
                                        <div className="informe-empty">No hay informes</div>
                                      ) : (
                                        informes.filter(function(inf){ return !isRestricted(user) || inf.usuario === user; }).map(function(inf){return (
                                          <div key={inf.id} className="informe-card">
                                            <div className="informe-card-header">
                                              <div style={{display:'flex',alignItems:'center',gap:'6px'}}><span style={{fontSize:'11px',fontWeight:600,color:'var(--accent)',background:'var(--accent-light)',padding:'1px 6px',borderRadius:'4px'}}>{inf.usuario === user ? 'Tú' : inf.usuario}</span><span className="informe-card-date">{new Date(inf.created_at).toLocaleDateString('es-ES', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' })}</span></div>
                                              {inf.usuario === user && <div style={{display:'flex',gap:'4px'}}>
                                                <button className="informe-card-edit" onClick={function(){editInforme(inf);}}>Editar</button>
                                                <button className="informe-card-delete" onClick={function(){deleteInforme(inf.id,player.nombre,selectedTeam);}}>Eliminar</button>
                                              </div>}
                                            </div>
                                            <div className="informe-card-text">{inf.texto}</div>
                                          </div>
                                        );})
                                      )}
                                    </div>
                                  </div>
                                  )}

                                </div>
                              </div>
                            </div>
                          )}
                        </div>
                      );
                    })}
                    {filteredPlayers.length === 0 && (
                      <div className="empty-state">No se encontraron jugadores con esos criterios</div>
                    )}
                  </div>
                  <div className="results-count">
                    Mostrando {filteredPlayers.length} de {currentTeam.jugadores.length} jugadores
                  </div>
                  {cuerpoTecnico[selectedTeam] && cuerpoTecnico[selectedTeam].length > 0 && (
                    <div className="staff-section">
                      <div className="staff-section-title">Cuerpo técnico</div>
                      <div className="staff-grid">
                        {cuerpoTecnico[selectedTeam].map(function(s, i){
                          var initials = s.nombre.split(' ').map(function(w){return w[0];}).join('').substring(0,2).toUpperCase();
                          return (
                            <div key={i} className="staff-card">
                              {s.foto ? (
                                <img src={s.foto} alt={s.nombre} className="staff-photo" onError={function(e){ e.target.style.display='none'; e.target.nextSibling.style.display='flex'; }} />
                              ) : null}
                              <div className="staff-photo-fallback" style={{display: s.foto ? 'none' : 'flex'}}>{initials}</div>
                              <div className="staff-info">
                                <div className="staff-name">{s.nombre}</div>
                                <div className="staff-role">{s.rol}</div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>
              </>
            )}

            {view === 'field' && (
              <FieldView players={currentTeam.jugadores} teamName={selectedTeam} />
            )}

            {view === 'lineup' && (
              <LineupView players={currentTeam.jugadores} teamName={selectedTeam} user={user} />
            )}

            {view === 'table' && (
              <ClassificationView teamName={selectedTeam} />
            )}

            {view === 'plicup' && selectedTeam === "Castilla" && (
              <CupView allPlayers={allPlayers} cupData={premierIntCup} rmLabel="Castilla" />
            )}

            {view === 'youth' && selectedTeam === "Juvenil A" && (
              <CupView allPlayers={allPlayers} cupData={youthLeague} rmLabel="Real Madrid" />
            )}

            {view === 'pizarra' && selectedTeam === "Juvenil A" && (user === "AlvaroLopez" || user === "SergioRguez") && (
              <PizarraView teamName="Juvenil A" />
            )}

            </>
            )}

            <footer className="footer">
              <p className="footer-text">La Fábrica 26/27 · Cantera Real Madrid · {totalPlayers} jugadores en {Object.keys(canteraData).length} equipos</p>
            </footer>
          </div>
        </div>
      );
    }

    /* ===== RENDER ===== */
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
